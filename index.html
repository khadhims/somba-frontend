<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
    <meta name="description" content="Somba - SEO Somba" />
    <link rel="icon" href="/logo-somba-2.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700">
    <link rel="stylesheet" href="/splash-screen.css">
    <style>
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes loading-bar {
            from { transform: translateX(-100%); }
            to { transform: translateX(0); }
        }
        .splash-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #1e293b 0%, #6d28d9 100%);
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 9999;
        }
        .splash-logo {
            width: 180px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 32px;
            animation: pulse 2s infinite ease-in-out;
            background: rgba(255,255,255,0.04);
            border-radius: 50%;
            box-shadow: 0 0 32px 0 rgba(109,40,217,0.15);
        }
        .splash-logo img {
            width: 140px;
            height: 140px;
            object-fit: contain;
            display: block;
        }
        .splash-loading-bar {
            width: 160px;
            height: 8px;
            background: rgba(255,255,255,0.2);
            border-radius: 8px;
            overflow: hidden;
            margin: 24px auto 0 auto;
        }
        .splash-loading-bar-inner {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #fff 0%, #e0e7ff 100%);
            border-radius: 8px;
            animation: loading-bar 1.8s infinite;
        }
        .splash-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 18px;
        }
        .splash-dot {
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
            animation: bounce 0.7s infinite alternate;
        }
        .splash-dot:nth-child(2) {
            animation-delay: 0.15s;
        }
        .splash-dot:nth-child(3) {
            animation-delay: 0.3s;
        }
        .splash-title {
            font-size: 2.2rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 8px;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(109,40,217,0.12);
        }
        .splash-desc {
            color: #e0e7ff;
            font-size: 1.1rem;
            margin-bottom: 8px;
        }
    </style>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somba</title>
</head>

<body class="page-loading">
    <!--begin::Theme mode setup on page load-->
    <script>
        let themeMode = "system";

        if (localStorage.getItem("kt_theme_mode_value")) {
            themeMode = localStorage.getItem("kt_theme_mode_value");
        }

        if (themeMode === "system") {
            themeMode = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }

        document.documentElement.setAttribute("data-bs-theme", themeMode);
    </script>
    <!--end::Theme mode setup on page load-->

    <div id="app"></div>

    <!--begin::Loading markup-->
        <div id="splash-screen" class="splash-screen">
            <div class="splash-logo">
                <img src="/logo-somba-2.png" alt="Somba Logo" />
            </div>
            <div class="splash-title">Somba</div>
            <div class="splash-desc">Memuat konten, mohon tunggu sebentar...</div>
            <div class="splash-dots">
                <div class="splash-dot"></div>
                <div class="splash-dot"></div>
                <div class="splash-dot"></div>
            </div>
            <div class="splash-loading-bar">
                <div class="splash-loading-bar-inner"></div>
            </div>
        </div>
    <!--end::Loading markup-->

    <script type="module" src="/src/main.ts"></script>
</body>

</html>
