.ci_rules: &ci_rules
  # Run on main branch
  - if: '$CI_COMMIT_BRANCH == "main"'
  # Run on semantic version tags (e.g. 1.0.0, 2.3.5)
  - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
  # Run for Merge Requests (submitted or pending)
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  # Otherwise, skip
  - when: never

.cd_rules: &cd_rules
  # Run on main branch
  - if: '$CI_COMMIT_BRANCH == "main"'
  # Run on semantic version tags (e.g. 1.0.0, 2.3.5)
  - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
  # Run for Merge Requests (submitted or pending)
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  # Otherwise, skip
  - when: never

variables:
  UV_VERSION: 0.7.6
  PYTHON_VERSION: 3.12
  BASE_LAYER: bookworm-slim
  UV_CACHE_DIR: .uv-cache
  UV_SYSTEM_PYTHON: 1

stages:
  # - test
  - build
  - deploy

build_and_push_dev:
  stage: build
  rules: *ci_rules
  image: docker:27.1.1
  services:
    - docker:27.1.1-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "Logging in to GitLab Container Registry..."
    - echo "$CI_REGISTRY_PASSWORD" | docker login registry.gitlab.com -u $CI_REGISTRY_USER --password-stdin
  script:
    - |
      IMAGE_TAG_LATEST="$CI_REGISTRY_IMAGE:dev"

      # Determine version for dev builds
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION="${CI_COMMIT_TAG}-dev"
      else
        VERSION="${CI_COMMIT_SHORT_SHA}-dev"
      fi

      echo "Using VITE_APP_VERSION=$VERSION"

      # VITE_APP_DEMO is derived from VERSION
      VITE_APP_DEMO="DEMO ${VERSION}"

      IMAGE_TAG="$CI_REGISTRY_IMAGE:$VERSION"

      echo "Building DEV image: $IMAGE_TAG"
      echo "Using VITE_APP_NAME=$VITE_APP_NAME"
      echo "Using VITE_APP_VERSION=$VERSION"
      echo "Using VITE_APP_DEMO=$VITE_APP_DEMO"
      echo "Using VITE_APP_API_URL=$VITE_APP_API_URL"

      docker build \
        --build-arg VITE_APP_NAME="$VITE_APP_NAME" \
        --build-arg VITE_APP_VERSION="$VERSION" \
        --build-arg VITE_APP_DEMO="$VITE_APP_DEMO" \
        --build-arg VITE_APP_API_URL="$VITE_APP_API_URL" \
        -t "$IMAGE_TAG" \
        -f Dockerfile.ci \
        . \
        --progress=plain

      docker push "$IMAGE_TAG"
      docker tag "$IMAGE_TAG" "$IMAGE_TAG_LATEST"
      docker push "$IMAGE_TAG_LATEST"

update_deployment_repo_dev:
  stage: deploy
  rules: *cd_rules
  before_script:
    #
    # Install ssh-agent if not already installed, it is required by Docker.
    # (change apt-get to yum if you use an RPM-based image)
    #
    - 'command -v ssh-agent >/dev/null || ( apt-get update -y && apt-get install openssh-client -y )'
    #
    # Run ssh-agent (inside the build environment)
    #
    - eval $(ssh-agent -s)
    #
    # Give the right permissions, otherwise ssh-add will refuse to add files
    # Add the SSH key stored in SSH_PRIVATE_KEY file type CI/CD variable to the agent store
    #
    - chmod 400 "$GIT_SSH_PRIV_KEY"
    - ssh-add "$GIT_SSH_PRIV_KEY"
    #
    # Create the SSH directory and give it the right permissions
    #
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - git config --global user.email "gitlabbot@kreasibinar.id"
    - git config --global user.name "gitlabbot"
    # Add GitLab.com host key
    - ssh-keyscan gitlab.com >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - git clone git@gitlab.com:somba-project/development/somba-deployments/somba-core-deployments.git
    - cd somba-core-deployments
    - git checkout main
    - git rebase main
    - |
      # Determine version for dev builds
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION="${CI_COMMIT_TAG}-dev"
      else
        VERSION="${CI_COMMIT_SHORT_SHA}-dev"
      fi
      IMAGE_TAG="$CI_REGISTRY_IMAGE:$VERSION"
      echo "Update using image: $IMAGE_TAG"
      sed -i "s|tag:.*|tag: \"$IMAGE_TAG\"|" deployments/platform/somba-web-ui/values-dev.yaml
      git add deployments/platform/somba-web-ui/values-dev.yaml
      git commit -m "ci: update image tag to $IMAGE_TAG" || echo "No changes"
    - git push origin main
  needs:
    - build_and_push_dev

