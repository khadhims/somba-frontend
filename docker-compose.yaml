
services:
  # Development service
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: somba-web-ui-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
    env_file:
      - .env
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0
    stdin_open: true
    tty: true

  # Production service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: somba-web-ui
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    restart: always

volumes:
  node_modules: